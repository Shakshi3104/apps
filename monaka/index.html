<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaka — 行きたい展示を、会期の最中に</title>
    <meta name="description" content="会期のある ToDo リスト。展示やイベント、行きたいお店を保存して、会期の最中に出かけよう。">
    <link rel="canonical" href="https://shakshi3104.github.io/apps/monaka/">
    <meta property="og:title" content="Monaka">
    <meta property="og:description" content="会期のある ToDo リスト。展示やイベント、行きたいお店を保存して、会期の最中に出かけよう。">
    <meta property="og:url" content="https://shakshi3104.github.io/apps/monaka/">
    <meta property="og:image" content="https://shakshi3104.github.io/apps/monaka/assets/monaka-og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Monaka">
    <meta name="twitter:description" content="会期のある ToDo リスト。展示やイベント、行きたいお店を保存して、会期の最中に出かけよう。">
    <meta name="twitter:image" content="https://shakshi3104.github.io/apps/monaka/assets/monaka-og-image.png">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        :root {
            /* The wafer's cream, and the icon's night sky for the ink. */
            --bg: #F6F4EC;
            --text: #1E2548;
            --text-soft: #5B6182;
            --accent: #3D56B2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero */
        .hero {
            padding: 120px 24px 16px;
            text-align: center;
        }

        .hero img.icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 32px;
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .hero p.tagline {
            font-size: 17px;
            color: var(--text-soft);
        }

        /* Main visual */
        .main-visual {
            padding: 0 24px;
            text-align: center;
        }

        .main-visual img {
            width: 100%;
            max-width: 880px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Features (minimal list) */
        .features {
            padding: 16px 24px 64px;
        }

        .features ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .features li {
            text-align: center;
        }

        .features li strong {
            display: block;
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .features li span {
            font-size: 15px;
            color: var(--text-soft);
        }

        /* Footer */
        footer {
            padding: 64px 24px 48px;
            text-align: center;
            color: var(--text-soft);
            font-size: 13px;
        }

        footer .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        footer a {
            color: var(--text-soft);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--accent);
        }

        footer .copyright {
            font-size: 12px;
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero {
                padding: 80px 24px 32px;
            }
            .hero h1 {
                font-size: 32px;
            }
            .hero p.tagline {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<header class="hero">
    <img class="icon" src="assets/icon.png" alt="Monaka icon">
    <h1>Monaka</h1>
    <p class="tagline">行きたい展示を、<br>会期の最中に。</p>
</header>

<section class="main-visual">
    <img src="assets/monaka-main-image.png" alt="Monaka app screens">
</section>

<section class="features container">
    <ul>
        <li>
            <strong>残りの会期で並ぶ</strong>
            <span>今週末・もうすぐ終了・開催中・これから。<br>いつでも行けるお店は Anytime に</span>
        </li>
        <li>
            <strong>シェアするだけで保存</strong>
            <span>美術館のページ、Instagram の投稿、Google Maps の場所から。<br>会場や会期は端末上の AI が読み取ります</span>
        </li>
        <li>
            <strong>地図で近くを探す</strong>
            <span>行きたい場所をピンで。残りの会期が色でわかります</span>
        </li>
        <li>
            <strong>すべては端末の中に</strong>
            <span>アカウント不要。保存したデータは端末の中だけに</span>
        </li>
    </ul>
</section>

<footer>
    <div class="links">
        <a href="../">Apps</a>
        <a href="https://github.com/Shakshi3104/Monaka">GitHub</a>
        <a href="privacy/">Privacy</a>
        <a href="mailto:shakshi3104.support@icloud.com">Contact</a>
    </div>
    <p class="copyright">© 2026 Shakshi3104</p>
</footer>

</body>
</html>
