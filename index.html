<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps — Shakshi3104</title>
    <meta name="description" content="Shakshi3104 がつくっている iOS アプリの一覧。">
    <link rel="canonical" href="https://shakshi3104.github.io/apps/">
    <meta property="og:title" content="Apps — Shakshi3104">
    <meta property="og:description" content="Shakshi3104 がつくっている iOS アプリの一覧。">
    <meta property="og:url" content="https://shakshi3104.github.io/apps/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Apps — Shakshi3104">
    <meta name="twitter:description" content="Shakshi3104 がつくっている iOS アプリの一覧。">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="madeleine/assets/icon.png">
    <style>
        /* iOS system colors */
        :root {
            --bg: #F2F2F7;               /* systemGroupedBackground */
            --group-bg: #FFFFFF;         /* secondarySystemGroupedBackground */
            --label: #000000;
            --label-secondary: rgba(60, 60, 67, 0.6);
            --label-tertiary: rgba(60, 60, 67, 0.3);
            --separator: rgba(60, 60, 67, 0.29);
            --row-highlight: rgba(60, 60, 67, 0.09);
            --icon-border: rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --group-bg: #1C1C1E;
                --label: #FFFFFF;
                --label-secondary: rgba(235, 235, 245, 0.6);
                --label-tertiary: rgba(235, 235, 245, 0.3);
                --separator: rgba(84, 84, 88, 0.65);
                --row-highlight: rgba(235, 235, 245, 0.12);
                --icon-border: rgba(255, 255, 255, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                         "Hiragino Sans", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--label);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .screen {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 20px 48px;
        }

        /* Large Title */
        .large-title {
            padding: 56px 0 8px;
        }

        .large-title h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.2;
        }

        /* Section header */
        h2.section-header {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.35;
            color: var(--label-secondary);
            padding: 28px 16px 7px;
            letter-spacing: -0.08px;
        }

        /* Inset grouped list */
        .group {
            background: var(--group-bg);
            border-radius: 12px;
            overflow: hidden;
            list-style: none;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: background-color 0.1s ease;
        }

        .row:active {
            background-color: var(--row-highlight);
        }

        /* Hairline separator, inset to align with the text column */
        .group li + li .row::before {
            content: "";
            position: absolute;
            top: 0;
            left: 88px;
            right: 0;
            height: 1px;
            transform: scaleY(0.5);
            transform-origin: top;
            background: var(--separator);
        }

        .group.plain li + li .row::before {
            left: 16px;
        }

        .row img.app-icon {
            width: 60px;
            height: 60px;
            border-radius: 13px;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 0.5px var(--icon-border);
        }

        .row .text {
            flex: 1;
            min-width: 0;
        }

        .row .title {
            display: block;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
            line-height: 1.35;
        }

        .row .subtitle {
            display: block;
            margin-top: 2px;
            font-size: 13px;
            line-height: 1.4;
            letter-spacing: -0.08px;
            color: var(--label-secondary);
        }

        .row .chevron {
            flex-shrink: 0;
            width: 8px;
            height: 13px;
            color: var(--label-tertiary);
        }

        /* Link rows (no app icon) */
        .row.link {
            padding: 12px 16px;
            min-height: 44px;
        }

        /* Section footer */
        .section-footer {
            font-size: 13px;
            line-height: 1.45;
            color: var(--label-secondary);
            padding: 8px 16px 0;
            letter-spacing: -0.08px;
        }

        .copyright {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: var(--label-tertiary);
        }

        @media (max-width: 400px) {
            .screen {
                padding: 0 16px 40px;
            }
            .large-title {
                padding-top: 44px;
            }
            .group li + li .row::before {
                left: 84px;
            }
        }
    </style>
</head>
<body>

<div class="screen">

    <header class="large-title">
        <h1>Apps</h1>
    </header>

    <h2 class="section-header">アプリ</h2>
    <ul class="group">
        <li>
            <a class="row" href="madeleine/">
                <img class="app-icon" src="madeleine/assets/icon.png" alt="">
                <span class="text">
                    <span class="title">Madeleine</span>
                    <span class="subtitle">Live Photo に隠れた1秒を繋いで、旅の記憶をショート Vlog に。</span>
                </span>
                <svg class="chevron" viewBox="0 0 8 13" fill="none" aria-hidden="true">
                    <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </li>
        <li>
            <a class="row" href="yomy/">
                <img class="app-icon" src="yomy/assets/icon.png" alt="">
                <span class="text">
                    <span class="title">yomy</span>
                    <span class="subtitle">フィードを集めて、自分だけの朝刊に。</span>
                </span>
                <svg class="chevron" viewBox="0 0 8 13" fill="none" aria-hidden="true">
                    <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </li>
        <li>
            <a class="row" href="langue-de-chat/">
                <img class="app-icon" src="langue-de-chat/assets/icon.png" alt="">
                <span class="text">
                    <span class="title">LangueDeChat</span>
                    <span class="subtitle">配達の状況をひとつの画面で。</span>
                </span>
                <svg class="chevron" viewBox="0 0 8 13" fill="none" aria-hidden="true">
                    <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </li>
    </ul>
    <p class="section-footer">各アプリのプライバシーポリシーは、それぞれのページから確認できます。</p>

    <h2 class="section-header">リンク</h2>
    <ul class="group plain">
        <li>
            <a class="row link" href="https://github.com/Shakshi3104">
                <span class="text"><span class="title">GitHub</span></span>
                <svg class="chevron" viewBox="0 0 8 13" fill="none" aria-hidden="true">
                    <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </li>
        <li>
            <a class="row link" href="mailto:shakshi3104.support@icloud.com">
                <span class="text"><span class="title">お問い合わせ</span></span>
                <svg class="chevron" viewBox="0 0 8 13" fill="none" aria-hidden="true">
                    <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </li>
    </ul>

    <p class="copyright">© 2026 Shakshi3104</p>

</div>

</body>
</html>
